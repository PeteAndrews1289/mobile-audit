name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  swift-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test iPhone app core
        working-directory: ios
        run: swift test -j 1 --scratch-path "$RUNNER_TEMP/mobile-audit-swift"
