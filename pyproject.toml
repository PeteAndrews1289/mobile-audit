[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-audit"
version = "0.6.0"
description = "Local evidence collection for iOS app privacy and mobile security research"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
android = ["androguard>=4.1,<5"]

[project.scripts]
mobile-audit = "mobile_audit.cli:main"

[tool.setuptools.packages.find]
include = ["mobile_audit*"]
